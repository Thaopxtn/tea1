name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  NEXT_PUBLIC_SITE_URL: https://example.com
  ADMIN_AUTH_REQUIRED: "true"
  AUTH_SECRET: ci-only-secret-with-more-than-32-characters
  ADMIN_EMAIL: ci-admin@example.com
  ADMIN_PASSWORD: ci-only-password-never-used-in-production
  PAYMENT_MODE: disabled

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install dependencies
        shell: bash
        run: |
          {
            echo "### Toolchain"
            echo '```text'
            node --version
            npm --version
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          set -o pipefail
          if ! npm ci --foreground-scripts 2>&1 | tee npm-ci.log; then
            failure_message="$(tail -c 5000 npm-ci.log)"
            failure_message="${failure_message//'%'/'%25'}"
            failure_message="${failure_message//$'\r'/'%0D'}"
            failure_message="${failure_message//$'\n'/'%0A'}"
            echo "::error title=npm ci failed (Node $(node --version), npm $(npm --version))::$failure_message"
            {
              echo "### npm ci failed"
              echo '```text'
              tail -n 100 npm-ci.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npx prisma validate
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install dependencies
        shell: bash
        run: |
          {
            echo "### Toolchain"
            echo '```text'
            node --version
            npm --version
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          set -o pipefail
          if ! npm ci --foreground-scripts 2>&1 | tee npm-ci.log; then
            failure_message="$(tail -c 5000 npm-ci.log)"
            failure_message="${failure_message//'%'/'%25'}"
            failure_message="${failure_message//$'\r'/'%0D'}"
            failure_message="${failure_message//$'\n'/'%0A'}"
            echo "::error title=npm ci failed (Node $(node --version), npm $(npm --version))::$failure_message"
            {
              echo "### npm ci failed"
              echo '```text'
              tail -n 100 npm-ci.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - run: npx playwright install --with-deps chromium
      - name: Run end-to-end tests
        shell: bash
        run: |
          set -o pipefail
          if ! npm run test:e2e 2>&1 | tee e2e.log; then
            failure_message="$(tail -c 10000 e2e.log)"
            failure_message="${failure_message//'%'/'%25'}"
            failure_message="${failure_message//$'\r'/'%0D'}"
            failure_message="${failure_message//$'\n'/'%0A'}"
            echo "::error title=Playwright end-to-end tests failed::$failure_message"
            exit 1
          fi
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
